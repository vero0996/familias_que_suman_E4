services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: familias_test
      POSTGRES_PASSWORD: solo_pruebas
      POSTGRES_DB: familias_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U familias_test -d familias_test
      interval: 2s
      timeout: 5s
      retries: 15