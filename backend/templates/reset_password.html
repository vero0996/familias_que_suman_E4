<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña | Familias que Suman</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #edf7f5;
      color: #183c39;
      font: 16px system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px #153e3912;
    }
    h1 { font-size: 26px; margin-top: 8px; }
    .brand { color: #087d73; font-weight: 700; }
    p { line-height: 1.5; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input, button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border-radius: 12px;
      font: inherit;
    }
    input { border: 1px solid #94aaa6; }
    button {
      margin-top: 24px;
      border: 0;
      background: #087d73;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #66c7bb;
      outline-offset: 3px;
    }
    small { display: block; margin-top: 8px; color: #526963; }
    #message { margin-bottom: 0; }
    .error { color: #a62929; }
    .success { color: #087d73; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Familias que Suman +</div>
    <h1>Restablece tu contraseña</h1>
    <p>Elige una contraseña nueva para volver a entrar a tu cuenta.</p>

    <form id="reset-form" method="post" action="/auth/reset-password">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" required
             minlength="8" maxlength="128" autocomplete="new-password">
      <small>Entre 8 y 128 caracteres.</small>

      <label for="confirmation">Confirmar contraseña</label>
      <input id="confirmation" type="password" required
             minlength="8" maxlength="128" autocomplete="new-password">

      <button id="submit" type="submit">Guardar contraseña</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("reset-form");
    const password = document.getElementById("password");
    const confirmation = document.getElementById("confirmation");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    // Acepta los enlaces nuevos y los anteriores que usaban ?token=.
    let token =
      new URLSearchParams(location.hash.slice(1)).get("token") ||
      new URLSearchParams(location.search).get("token");

    // Retira el token de la dirección visible.
    history.replaceState(null, "", location.pathname);

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "success";
    }

    if (!token) {
      form.hidden = true;
      showMessage(
        "Falta el enlace de recuperación. Solicita uno nuevo desde la app.",
        true
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (button.disabled || !token) return;

      if (password.value !== confirmation.value) {
        showMessage("Las contraseñas no coinciden.", true);
        return;
      }

      button.disabled = true;
      password.disabled = true;
      confirmation.disabled = true;
      button.textContent = "Guardando…";
      message.textContent = "";

      try {
        const response = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "omit",
          cache: "no-store",
          body: JSON.stringify({
            token: token,
            new_password: password.value,
            confirm_password: confirmation.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const detail = typeof data.detail === "string"
            ? data.detail
            : "Revisa los datos e intenta nuevamente.";

          throw new Error(
            response.status === 429
              ? "Demasiados intentos. Espera un minuto antes de reintentar."
              : detail
          );
        }

        token = null;
        form.reset();
        form.hidden = true;
        showMessage(
          "Tu contraseña fue actualizada. Vuelve a la app e inicia sesión."
        );
      } catch (error) {
        showMessage(
          error instanceof TypeError
            ? "No se pudo conectar. Revisa tu conexión e intenta nuevamente."
            : error.message,
          true
        );
      } finally {
        button.disabled = false;
        password.disabled = false;
        confirmation.disabled = false;
        button.textContent = "Guardar contraseña";
      }
    });
  </script>
</body>
</html>
